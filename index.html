<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألوان صوتية</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    
    <div class="container">
        <h1>🎨 ألوان صوتية</h1>
        <p class="subtitle">اضغط على أيقونة أو استخدم الكيبورد</p>
        
        <button id="enableAudio" class="enable-btn">🔊 تفعيل الصوت</button>
        
        <div class="colors-grid">
            <div class="color-box" data-key="a" data-sound="أحمر" style="background: #ff6b6b;">
                <span class="key-hint">A</span>
                <span class="color-name">أحمر</span>
            </div>
            
            <div class="color-box" data-key="s" data-sound="برتقالي" style="background: #ffa502;">
                <span class="key-hint">S</span>
                <span class="color-name">برتقالي</span>
            </div>
            
            <div class="color-box" data-key="d" data-sound="أصفر" style="background: #ffeaa7;">
                <span class="key-hint">D</span>
                <span class="color-name">أصفر</span>
            </div>
            
            <div class="color-box" data-key="f" data-sound="أخضر" style="background: #26de81;">
                <span class="key-hint">F</span>
                <span class="color-name">أخضر</span>
            </div>
            
            <div class="color-box" data-key="g" data-sound="أزرق" style="background: #4bcffa;">
                <span class="key-hint">G</span>
                <span class="color-name">أزرق</span>
            </div>
            
            <div class="color-box" data-key="h" data-sound="بنفسجي" style="background: #a55eea;">
                <span class="key-hint">H</span>
                <span class="color-name">بنفسجي</span>
            </div>
            
            <div class="color-box" data-key="j" data-sound="وردي" style="background: #fd79a8;">
                <span class="key-hint">J</span>
                <span class="color-name">وردي</span>
            </div>
            
            <div class="color-box" data-key="k" data-sound="أسود" style="background: #2d3436;">
                <span class="key-hint">K</span>
                <span class="color-name">أسود</span>
            </div>
        </div>
        
        <div class="instructions">
            <p>💡 المفاتيح: A S D F G H J K</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
